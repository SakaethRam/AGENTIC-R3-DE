name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  schema-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install jsonschema

      - name: Validate actor.json is well-formed
        run: python -c "import json; json.load(open('.actor/actor.json'))"

      - name: Validate input schema is well-formed
        run: python -c "import json; json.load(open('.actor/input_schema.json'))"

      - name: Validate dataset schema is well-formed
        run: python -c "import json; json.load(open('.actor/dataset_schema.json'))"

      - name: Validate fixtures against dataset schema
        run: |
          python -c "
          import json, jsonschema, glob
          schema = json.load(open('.actor/dataset_schema.json'))
          for path in glob.glob('tests/fixtures/*.json'):
              sample = json.load(open(path))
              jsonschema.validate(sample, schema)
              print(f'OK: {path}')
          "

  smoke-test:
    runs-on: ubuntu-latest
    needs: schema-validate
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Run actor against sample input
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          curl -sf -X POST \
            "https://api.apify.com/v2/acts/gunmetal~r3-de/run-sync-get-dataset-items?token=${APIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d @tests/fixtures/sample_input.json \
            -o /tmp/output.json
          test -s /tmp/output.json
